# Load generator: hammers the php-apache service in a loop
apiVersion: apps/v1
kind: Deployment
metadata:
  name: load
spec:
  # 4 loops keep the HPA at its maximum of 6 pods, which needs 2 agents
  replicas: 4
  selector:
    matchLabels:
      app: load
  template:
    metadata:
      labels:
        app: load
    spec:
      # Visitors run on their own node, never on the autoscaled agents
      nodeSelector:
        workload: load
      tolerations:
        - key: workload
          value: load
          effect: NoSchedule
      containers:
        - name: load
          image: busybox:1.37
          command:
            - sh
            - -c
            - while true; do wget -q -O- http://php-apache >/dev/null; done
